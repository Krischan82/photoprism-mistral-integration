services:
  photoprism-mistral:
    build: .
    container_name: photoprism-mistral-integration
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_FILE: "/app/logs/photoprism-mistral.log"
    volumes:
      # Matches a docker/compose/<stack>/logs layout as e.g.:
      # docker/compose/photoprism-mistral -> ../../logs/photoprism-mistral
      - ${LOG_DIR:-./logs}:/app/logs
    # PhotoPrism runs on a different host on the same network here, so
    # there's no shared Docker network to join - PHOTOPRISM_URL in .env
    # just points at its LAN IP/hostname. If PhotoPrism ever runs on this
    # same Docker host, join its network instead, e.g.:
    #
    # networks:
    #   - photoprism
    #
    # networks:
    #   photoprism:
    #     external: true
    #     name: <actual network name, see `docker network ls`>
